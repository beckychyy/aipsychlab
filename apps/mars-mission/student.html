<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061018"><title>火星任务｜学生端口</title><link rel="stylesheet" href="student.css"></head><body>
<header><a href="./">SRT// 尚睿通深空任务仓</a><span id="portName">学生任务端口</span><i id="linkState">等待任务</i></header>
<main><section id="terminal" class="terminal"><div class="terminal-no" id="terminalNo">PORT 01</div><p class="role-tag" id="roleTag">轨道导航</p><h1 id="roleTitle">导航员</h1><p class="mission-order" id="missionOrder">读取任务中……</p><div class="question-card"><small>只完成你负责的这一题</small><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" class="feedback">先和小组成员说出理由，再选择。</p></div><button id="submitTask" type="button" disabled>提交给任务大屏</button></section>
<section id="terminalDone" class="terminal done"><div class="complete-mark">✓</div><p class="role-tag">任务已提交</p><h1 id="doneTitle">导航员完成</h1><div class="learn-card"><small>你的知识发现</small><p id="doneLearn"></p></div><div class="code-card"><small>如果大屏没有自动收到，请向老师报告口令</small><b id="missionCode"></b></div><a href="student.html">返回五端口大厅</a></section>
<section id="hub" class="hub"><p class="role-tag">五人协作任务</p><h1>选择你的岗位</h1><p>每名学生只进入一个端口，完成不同任务。</p><div id="portGrid"></div><a class="back" href="./">返回公共任务大屏</a></section></main>
<script type="module" src="student.js"></script></body></html>
